<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Практика по формам</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="group">
				<legend class="title">Ваши личные данные</legend>

				<label for="name" class="label">Ваше имя</label>
				<input type="text" id="name" class="input" placeholder="Имя" required />

				<label for="age" class="label">Ваш возраст</label>
				<input
					type="number"
					id="age"
					class="input"
					placeholder="Возраст"
					required
				/>

				<label for="phone" class="label">Ваш номер телефона</label>
				<input
					type=" tel"
					id="phone"
					class="input"
					placeholder="Телефон"
					required
				/>

				<label for="email" class="label">Ваша почта</label>
				<input
					type="email"
					id="email"
					class="input"
					placeholder="Почта"
					name="email"
					required
				/>
			</fieldset>
			<fieldset class="group">
				<label for="message" class="label">Сообщение</label>
				<textarea
					class="textarea"
					id="message"
					class="textarea"
					placeholder="Ваше сообщение"
					required
				></textarea>
			</fieldset>

			<label class="label">
				<input type="checkbox" class="checkbox" name="checkbox" required />
				<span class="checkbox-size">Я принимаю правила</span>
			</label>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
